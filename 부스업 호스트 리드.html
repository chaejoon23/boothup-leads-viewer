<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부스업 호스트 리드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 요약 + 탭, 그 아래 필터 줄과 넓은 표 하나. 표만 가로 스크롤. */
:root{
  --bg:#f4f6f7; --surface:#ffffff; --line:#d9dfe3; --text:#17232b; --muted:#5b6b76;
  --accent:#0b6e75; --accent-soft:#e0f0f1; --warn:#9a5b00; --warn-soft:#fbefd9;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171b; --surface:#182228; --line:#2b3941; --text:#e6edf0; --muted:#94a5af;
    --accent:#5cc5cc; --accent-soft:#1c3a3d; --warn:#f0b45a; --warn-soft:#3a2c12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171b; --surface:#182228; --line:#2b3941; --text:#e6edf0; --muted:#94a5af;
  --accent:#5cc5cc; --accent-soft:#1c3a3d; --warn:#f0b45a; --warn-soft:#3a2c12;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:4px}
h1{font-size:22px;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:65ch}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;padding:8px 14px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.tab b{font-weight:600}
.tab span{color:var(--muted);font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tab[aria-selected="true"] span{color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.filters input[type=search],.filters select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.filters label.chk{display:flex;gap:6px;align-items:center;color:var(--text);cursor:pointer}
.count{margin-left:auto;color:var(--muted);font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--surface);font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap}
th button{appearance:none;border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:0;display:inline-flex;gap:4px}
th button:hover{color:var(--text)}
th[aria-sort] button{color:var(--accent)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.tel{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.name{font-weight:500;min-width:200px}
td.ev{color:var(--muted);min-width:180px}
td a{color:var(--accent);text-decoration:none;word-break:break-all}
td a:hover{text-decoration:underline}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px;white-space:nowrap}
.pill.top{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pill.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.score{display:inline-flex;align-items:center;gap:6px}
.bar{width:44px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;color:var(--muted);font-family:var(--font-mono);font-size:12px}
.pager button{appearance:none;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:6px;padding:6px 12px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.empty{padding:32px;text-align:center;color:var(--muted)}
.note{color:var(--muted);font-size:12px;margin:0;max-width:80ch}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:480px){.count{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>부스업 호스트 리드</h1>
    <p class="sub">공공데이터포털 자료로 정리한 호스트 후보 목록입니다. 2026-11-10 기준이며, 이메일은 원본 데이터에 없어 포함되지 않았습니다.</p>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="filters">
    <input type="search" id="q" placeholder="기관명, 행사명, 주소, 전화번호 검색" aria-label="검색">
    <select id="f1" aria-label="유형"></select>
    <select id="f2" aria-label="지역"></select>
    <label class="chk" id="tglWrap"><input type="checkbox" id="tgl"><span id="tglLabel"></span></label>
    <span class="count" id="count"></span>
  </div>

  <div class="tablebox">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div class="empty" id="empty" hidden>조건에 맞는 항목이 없습니다. 검색어나 필터를 바꿔 보세요.</div>
  </div>

  <div class="pager">
    <span id="pageinfo"></span>
    <button type="button" id="prev">이전</button>
    <button type="button" id="next">다음</button>
  </div>

  <p class="note" id="note"></p>
</div>

    text:r=>r[0]+' '+r[2]+' '+r[4]+' '+r[8],
    note:'축제·공연행사 표준데이터의 주관기관 단위 목록입니다. 공연행사에서만 나온 기관은 전화·홈페이지가 공연장이나 지자체 것일 수 있어 "연락처 확인"으로 표시했습니다. 점수는 최근 개최, 개최 횟수, 축제 보유, 기관 유형, 연락 채널 수로 매긴 임의 기준입니다.'},
  commission:{label:'수수료 호스트',rows:DATA.c,f1:1,f2:r=>r[5],tgl:'상위 300곳만',tglOn:true,tglFn:r=>r[8]===1,sort:[7,-1],
    cols:[
      {t:'점포명',k:0,cls:'name',r:r=>esc(r[0])+(r[8]?' <span class="pill top">상위 300</span>':'')},
      {t:'분류',k:1,r:r=>`<span class="pill">${esc(r[1])}</span>`},
      {t:'운영사(추정)',k:2,r:r=>esc(r[2])},
      {t:'대표전화',k:3,cls:'tel',r:r=>esc(r[3])},
      {t:'주소',k:4,cls:'ev',r:r=>esc(r[4])},
      {t:'매장면적(㎡)',k:6,cls:'num',r:r=>r[6]?r[6].toLocaleString('ko-KR'):''},
      {t:'점수',k:7,cls:'num',r:r=>score(r[7],11)}
    ],
    text:r=>r[0]+' '+r[2]+' '+r[3]+' '+r[4],
    note:'행정안전부 대규모점포 인허가 데이터에서 정상 영업 중인 점포만 추렸습니다. 운영사는 점포명 키워드로 추정한 값이라 틀릴 수 있고, 전화번호는 인허가 등록 시점 기준입니다.'},
  review:{label:'검토 필요',rows:DATA.v,cols:orgCols,f1:1,f2:r=>sido(r[8]),tgl:'',sort:[6,-1],
    text:r=>r[0]+' '+r[2]+' '+r[4]+' '+r[8],
    note:'전화와 홈페이지가 모두 없거나, 이름이 짧아 단체인지 개인인지 자동으로 구분하지 못한 항목입니다. 사람이 확인한 뒤 사용하세요.'}
};
const $=id=>document.getElementById(id);
let cur='general',page=0,sortK,sortD,state={};

function opts(sel,label,vals){
  sel.innerHTML=`<option value="">${label} 전체</option>`+vals.map(([v,n])=>`<option value="${esc(v)}">${esc(v)} (${n})</option>`).join('');
}
function tally(rows,fn){const m=new Map();for(const r of rows){const v=fn(r);if(v)m.set(v,(m.get(v)||0)+1)}return [...m].sort((a,b)=>b[1]-a[1])}

function setView(name){
  if(!VIEWS[name])name='general';
  cur=name;const v=VIEWS[name];page=0;[sortK,sortD]=v.sort;
  $('q').value='';
  opts($('f1'),name==='commission'?'분류':'유형',tally(v.rows,r=>r[v.f1]));
  opts($('f2'),'지역',tally(v.rows,v.f2));
  $('tglWrap').hidden=!v.tgl;$('tglLabel').textContent=v.tgl;$('tgl').checked=!!v.tglOn;
  $('note').textContent=v.note;
  for(const b of $('tabs').children)b.setAttribute('aria-selected',b.dataset.v===name);
  render();
}
function filtered(){
  const v=VIEWS[cur],q=$('q').value.trim().toLowerCase(),a=$('f1').value,b=$('f2').value,t=v.tgl&&$('tgl').checked;
  let rows=v.rows.filter(r=>(!a||r[v.f1]===a)&&(!b||v.f2(r)===b)&&(!t||v.tglFn(r))&&(!q||v.text(r).toLowerCase().includes(q)));
  rows.sort((x,y)=>{const p=x[sortK],s=y[sortK];if(p===s)return 0;if(p===''||p===0&&typeof p==='number'&&sortK!==9&&sortK!==7)return 1;if(s===''||s===0&&typeof s==='number'&&sortK!==9&&sortK!==7)return -1;return (typeof p==='number'?p-s:String(p).localeCompare(String(s),'ko'))*sortD});
  return rows;
}
function render(){
  const v=VIEWS[cur],rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/PAGE));
  if(page>=pages)page=pages-1;
  $('head').innerHTML=v.cols.map(c=>`<th class="${c.cls==='num'?'num':''}"${c.k===sortK?` aria-sort="${sortD>0?'ascending':'descending'}"`:''}><button type="button" data-k="${c.k}">${c.t}${c.k===sortK?(sortD>0?' ▲':' ▼'):''}</button></th>`).join('');
  $('body').innerHTML=rows.slice(page*PAGE,(page+1)*PAGE).map(r=>'<tr>'+v.cols.map(c=>`<td class="${c.cls||''}">${c.r(r)}</td>`).join('')+'</tr>').join('');
  $('empty').hidden=rows.length>0;
  $('count').textContent=`${rows.length.toLocaleString('ko-KR')} / ${v.rows.length.toLocaleString('ko-KR')}곳`;
  $('pageinfo').textContent=`${page+1} / ${pages} 쪽`;
  $('prev').disabled=page===0;$('next').disabled=page>=pages-1;
}
$('tabs').innerHTML=Object.entries(VIEWS).map(([k,v])=>`<button type="button" class="tab" role="tab" data-v="${k}"><b>${v.label}</b><span>${v.rows.length.toLocaleString('ko-KR')}</span></button>`).join('');
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){try{location.hash=b.dataset.v}catch(_){};setView(b.dataset.v)}});
$('head').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=+b.dataset.k;if(k===sortK)sortD=-sortD;else{sortK=k;sortD=typeof VIEWS[cur].rows[0][k]==='number'?-1:1}page=0;render()});
for(const id of ['q','f1','f2','tgl'])$(id).addEventListener('input',()=>{page=0;render()});
$('prev').addEventListener('click',()=>{page--;render();});
$('next').addEventListener('click',()=>{page++;render();});
window.addEventListener('hashchange',()=>setView(location.hash.slice(1)));
setView(location.hash.slice(1)||'general');
</script>
</body>
</html>
